services:
  web:
    image: nginx:alpine
    container_name: servidor_web
    ports:
      - "8084:80"
    volumes:
      - ./Web:/usr/share/nginx/html:ro
    restart: unless-stopped
  web2:
    image: nginx:alpine
    container_name: servidor_web2
    ports:
      - "8083:80"
    volumes:
      - ./Web2:/usr/share/nginx/html:ro
    restart: unless-stopped